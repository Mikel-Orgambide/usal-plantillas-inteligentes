; Firmware de la plantilla instrumentada (ESP32, Arduino Core).
; ADR 0006. Dos entornos: adquisición sintética (sin sensores) y analógica (FSR).
[platformio]
default_envs = esp32-synthetic

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 460800
; Carga a 115200: más lenta pero estable con esta placa (a 460800 se cortó al 54 %).
upload_speed = 115200
build_flags = -std=gnu++17 -Wall -Wextra
build_unflags = -std=gnu++11
lib_deps =
  h2zero/NimBLE-Arduino @ ^2.3.0
  bblanchon/ArduinoJson @ ^7.4.0

[env:esp32-synthetic]
build_flags = ${env.build_flags} -DACQ_SYNTHETIC=1

[env:esp32-analog]
build_flags = ${env.build_flags} -DACQ_ANALOG=1
