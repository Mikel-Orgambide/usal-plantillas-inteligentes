; Firmware de la plantilla instrumentada (ESP32, Arduino Core).
; ADR 0006. Dos entornos: adquisición sintética (sin sensores) y analógica (FSR).
[platformio]
default_envs = esp32-synthetic

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 230400
; Guarda todo lo que muestra el monitor en firmware/logs/ (la terminal de VS Code recorta las corridas largas).
monitor_filters = default, log2file
; Carga a 115200: más lenta pero estable con esta placa (a 460800 se cortó al 54 %).
upload_speed = 115200
build_flags = -std=gnu++17 -Wall -Wextra
; El programa de prueba del ADC vive en src/adc_test/ y solo se compila en su entorno.
build_src_filter = +<*> -<adc_test/>
build_unflags = -std=gnu++11
lib_deps =
  h2zero/NimBLE-Arduino @ ^2.3.0
  bblanchon/ArduinoJson @ ^7.4.0

[env:esp32-synthetic]
build_flags = ${env.build_flags} -DACQ_SYNTHETIC=1

[env:esp32-analog]
build_flags = ${env.build_flags} -DACQ_ANALOG=1

; Prueba de banco del ADC (H2-H4): imprime las seis cuentas crudas por USB, sin BLE ni contrato.
[env:esp32-adc-test]
build_src_filter = +<adc_test/>
