<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  chip(variant, text, icon) {
    var P = window.Plantillas;
    if (typeof React === 'undefined' || !P || !P.Chip) return null;
    return React.createElement(P.Chip, icon ? { variant: variant, icon: icon } : { variant: variant }, text);
  }
  renderVals() {
    return {
      yes: true,
      no: false,
      chipIncompleta: this.chip('alert', 'Incompleta · desconexión'),
      chipCierre: this.chip('alert', 'Incompleta · cierre'),
      chipSim: this.chip('sim', 'Simulada', 'settings')
    };
  }
}
</script>
