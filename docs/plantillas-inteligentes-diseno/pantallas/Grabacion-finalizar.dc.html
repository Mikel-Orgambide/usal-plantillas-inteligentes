:root{--bg:#0c0d10;--surface:#15181c;--surface-elevated:#1f2329;--line:#2b3038;--text-primary:#f2f4f7;--text-secondary:#98a2ad;--accent:#b48cff;--accent-soft:#b48cff24;--on-accent:#0c0d10;--alert:#e3a856;--alert-soft:#e3a85622;--on-alert:#0c0d10;--stale:#6a7481;--focus-ring:#b48cff;--chart-gap:#2b3038;--font-sans:"Manrope","Segoe UI",Roboto,system-ui,sans-serif;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--space-12:48px;--radius-sm:6px;--radius-md:12px;--radius-lg:20px;--radius-pill:999px}

<div style="width: 412px; height: 915px; box-sizing: border-box; position: relative; background: #0c0d10; color: #f2f4f7; font-family: Manrope, 'Segoe UI', sans-serif; overflow: hidden">
  <div style="position: absolute; inset: 0; box-sizing: border-box; padding: 0 16px 24px; display: flex; flex-direction: column; opacity: 0.35" aria-hidden="true">
    <div style="display: flex; align-items: center; gap: 8px; padding: 28px 0 0; font-size: 12px; line-height: 16px; letter-spacing: 0.02em; color: #98a2ad">

    </div>
    <x-import component-from-global-scope="Plantillas.ValueCard" label="Duración" value="12:48" unit="min" size="xl" style="display: block; margin-top: 24px"></x-import>
    <x-import component-from-global-scope="Plantillas.FootMap" left="{{left}}" right="{{right}}" style="display: block; margin-top: 24px"></x-import>

    <p style="margin: 0; font-size: 16px; line-height: 22px; color: #98a2ad">Se guardan <span style="color: #f2f4f7; font-variant-numeric: tabular-nums">12:48</span> min y <span style="color: #f2f4f7; font-variant-numeric: tabular-nums">19 203</span> registros. Una sesión finalizada no se puede reanudar.</p>
    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 12px">
      <x-import component-from-global-scope="Plantillas.Button" variant="danger" block="{{yes}}" icon="stop">Finalizar</x-import>
      <x-import component-from-global-scope="Plantillas.Button" variant="secondary" block="{{yes}}">Seguir grabando</x-import>
    </div>
  </div>
</div>
